name: Build and Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - "manifest.json"
      - "**.md"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore jellyfin-plugin-popular-tracks.sln

    - name: Check formatting
      run: dotnet format jellyfin-plugin-popular-tracks.sln --verify-no-changes

    - name: Build (strict)
      run: dotnet build jellyfin-plugin-popular-tracks.sln --configuration Release --no-restore /p:TreatWarningsAsErrors=true

    - name: Run unit tests with coverage
      run: |
        dotnet test Jellyfin.Plugin.PopularTracks.Tests/Jellyfin.Plugin.PopularTracks.Tests.csproj \
          --configuration Release \
          --no-build \
          /p:CollectCoverage=true \
          /p:CoverletOutputFormat=json \
          /p:CoverletOutput=../coverage/coverage.json \
          /p:Include="[Jellyfin.Plugin.PopularTracks]*" \
          /p:ThresholdType=line \
          /p:Threshold=80

    - name: Run acceptance tests
      run: |
        dotnet test Jellyfin.Plugin.PopularTracks.AcceptanceTests/Jellyfin.Plugin.PopularTracks.AcceptanceTests.csproj \
          --configuration Release \
          --no-build

    - name: CRAP score check
      run: bash scripts/check-crap.sh coverage/coverage.json

    - name: Line count check
      run: bash scripts/check-line-count.sh 250

  release:
    runs-on: ubuntu-latest
    needs: validate

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Get next version
      id: get_version
      run: |
        LATEST=$(git tag --sort=-v:refname | head -1 | sed 's/^v//')
        if [ -z "$LATEST" ]; then
          LATEST="0.0.0.0"
        fi
        NEXT=$(echo "$LATEST" | awk -F. '{$NF=$NF+1; print}' OFS=.)
        echo "VERSION=$NEXT" >> $GITHUB_OUTPUT
        echo "Next version: $NEXT"

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore Jellyfin.Plugin.PopularTracks/Jellyfin.Plugin.PopularTracks.csproj

    - name: Build release
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}
        dotnet build Jellyfin.Plugin.PopularTracks/Jellyfin.Plugin.PopularTracks.csproj --configuration Release --no-restore \
          /p:TreatWarningsAsErrors=true \
          /p:Version=$VERSION \
          /p:AssemblyVersion=$VERSION \
          /p:FileVersion=$VERSION

    - name: Create release zip
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}
        mkdir -p release
        find Jellyfin.Plugin.PopularTracks -path "*/bin/Release/net10.0/*.dll" -exec cp {} release/ \;
        cd release
        zip -r ../jellyfin-plugin-popular-tracks-${VERSION}.zip .

    - name: Calculate checksum
      id: calculate_checksum
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}
        CHECKSUM=$(md5sum jellyfin-plugin-popular-tracks-${VERSION}.zip | awk '{ print $1 }')
        echo "CHECKSUM=$CHECKSUM" >> $GITHUB_OUTPUT

    - name: Update manifest.json (accumulate, never rewrite history)
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}
        python3 scripts/update-manifest.py "$VERSION" "jellyfin-plugin-popular-tracks-${VERSION}.zip"

    - name: Validate manifest.json
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}
        python3 scripts/validate-manifest.py manifest.json \
          --new-version "$VERSION" \
          --zip "jellyfin-plugin-popular-tracks-${VERSION}.zip"

    - name: Create tag and GitHub Release
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag "$VERSION"
        git push origin "$VERSION"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.get_version.outputs.VERSION }}
        files: |
          jellyfin-plugin-popular-tracks-${{ steps.get_version.outputs.VERSION }}.zip
          manifest.json
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Verify published release asset matches manifest
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}
        SOURCE_URL=$(python3 -c "import json; print(json.load(open('manifest.json'))[0]['versions'][0]['sourceUrl'])")
        EXPECTED=$(python3 -c "import json; print(json.load(open('manifest.json'))[0]['versions'][0]['checksum'])")
        echo "Downloading published asset: $SOURCE_URL"
        for i in 1 2 3 4 5; do
          curl -fsSL -o published.zip "$SOURCE_URL" && break
          echo "Download attempt $i failed; retrying in 10s..."
          sleep 10
        done
        ACTUAL=$(md5sum published.zip | awk '{ print $1 }')
        echo "expected=$EXPECTED actual=$ACTUAL"
        if [ "$EXPECTED" != "$ACTUAL" ]; then
          echo "ERROR: published asset md5 does not match manifest checksum" >&2
          exit 1
        fi

    - name: Update manifest on main
      run: |
        git fetch origin main
        git checkout main
        git add manifest.json
        git diff --cached --quiet || git commit -m "chore: update manifest for ${{ steps.get_version.outputs.VERSION }}"
        git push origin main
